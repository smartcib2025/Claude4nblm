[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude4nblm"
version = "0.1.0"
description = "Drive Claude Code with NotebookLM from your phone via a Telegram bot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "smartcib2025" }]
keywords = ["claude", "notebooklm", "telegram", "mcp", "agent"]
dependencies = [
    "python-telegram-bot>=21.0",
    "claude-agent-sdk>=0.1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
claude4nblm = "claude4nblm.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
